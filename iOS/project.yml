name: BatchBraid
options:
  bundleIdPrefix: com.shimondeitel.ropecraftlog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  BatchBraid:
    type: application
    platform: iOS
    sources:
      - path: BatchBraid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.ropecraftlog
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: BatchBraid/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  BatchBraidTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BatchBraidTests
      - path: BatchBraid.storekit
    dependencies:
      - target: BatchBraid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.ropecraftlog.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  BatchBraidUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BatchBraidUITests
    dependencies:
      - target: BatchBraid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.ropecraftlog.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  BatchBraid:
    build:
      targets:
        BatchBraid: all
        BatchBraidTests: [test]
        BatchBraidUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: BatchBraid.storekit
    test:
      config: Debug
      storeKitConfiguration: BatchBraid.storekit
      targets:
        - BatchBraidTests
        - BatchBraidUITests
    archive:
      config: Release
